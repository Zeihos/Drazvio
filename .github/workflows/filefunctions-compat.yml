name: FileFunctions compatibility (experimental)
on:
  push:
    paths:
      - 'native/filefunctions_compat/**'
      - '.github/workflows/filefunctions-compat.yml'
  pull_request:
    paths:
      - 'native/filefunctions_compat/**'
      - '.github/workflows/filefunctions-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x86 native plugin
        shell: pwsh
        run: ./native/filefunctions_compat/build.ps1
      - name: Upload experimental DLL
        uses: actions/upload-artifact@v4
        with:
          name: FileFunctions-compat-EXPERIMENTAL
          path: build-amx/FileFunctions.compat.EXPERIMENTAL.dll
          if-no-files-found: error
